name: PR Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [flash]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  simulation-test-jobs:

    name: simulation-tests (${{ matrix.arch }}, ${{ matrix.test_set }})

    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: sm120
            test_set: core
          - arch: sm90
            test_set: core
          - arch: sm90
            test_set: fa2
          - arch: sm90
            test_set: fa3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI Docker image
        run: |
          docker build -f docker/Dockerfile.ci -t gpgpu-sim-ci:latest .

          # Log image size for documentation accuracy
          IMAGE_SIZE=$(docker images gpgpu-sim-ci:latest --format "{{.Size}}")
          echo "CI Docker image size: $IMAGE_SIZE"

      - name: Run simulation tests in container
        timeout-minutes: 50
        run: |
          docker run --rm \
            --memory=7g \
            --memory-swap=7g \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e CI_ARCH=${{ matrix.arch }} \
            -e CI_TEST_SET=${{ matrix.test_set }} \
            -e CI_BUILD_JOBS=2 \
            -v ${{ github.workspace }}:/gpgpu-sim \
            -w /gpgpu-sim \
            gpgpu-sim-ci:latest \
            bash -c "./tests/ci/run_ci_tests.sh"

      - name: Upload simulation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-results-${{ matrix.arch }}-${{ matrix.test_set }}-attempt-${{ github.run_attempt }}
          path: tests/logs/ci
          if-no-files-found: warn

  simulation-tests:

    name: simulation-tests
    if: always()
    needs: simulation-test-jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify simulation test jobs
        env:
          JOB_RESULT: ${{ needs.simulation-test-jobs.result }}
        run: test "$JOB_RESULT" = success
