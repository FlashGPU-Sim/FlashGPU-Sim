name: PR Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [flash]
    types: [opened, synchronize, ready_for_review, reopened]

env:
  CI_IMAGE: ghcr.io/flashgpu-sim/flashgpu-sim-ci@sha256:502e8c96182dbfab43d861b956957ddaa51bdb6b975845da44905f1ccc24a404

jobs:
  plan:

    name: plan-tests

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read CI job manifest
        id: matrix
        run: |
          matrix="$(python3 tests/ci/planner.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run-tests:

    name: run-tests (${{ matrix.job }})

    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI Docker image
        run: docker pull "$CI_IMAGE"

      - name: Run simulation tests in container
        id: tests
        timeout-minutes: 50
        run: |
          docker run --rm \
            --memory=7g \
            --memory-swap=7g \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e CI_JOB=${{ matrix.job }} \
            -e CI_BUILD_JOBS=2 \
            -v ${{ github.workspace }}:/gpgpu-sim \
            -w /gpgpu-sim \
            "$CI_IMAGE" \
            bash -c "./tests/ci/run_ci_tests.sh"

      - name: Upload simulation test logs
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.job }}-${{ github.run_attempt }}
          path: tests/logs/ci
          if-no-files-found: warn

      - name: Report test failures
        if: always() && steps.tests.outcome == 'failure'
        env:
          CI_JOB: ${{ matrix.job }}
        run: |
          python3 tests/ci/report.py tests/logs/ci \
            >> "$GITHUB_STEP_SUMMARY"

  verify-status:

    name: verify-status
    if: always()
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Verify status
        env:
          JOB_RESULT: ${{ needs.run-tests.result }}
        run: test "$JOB_RESULT" = success
