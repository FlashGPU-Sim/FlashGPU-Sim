name: PR Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [flash]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  plan:

    name: plan-tests

    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read CI job manifest
        id: matrix
        run: |
          matrix="$(python3 tests/ci/planner.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run-tests:

    name: run-tests (${{ matrix.job }})

    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI Docker image
        run: |
          docker build -f docker/Dockerfile.ci -t gpgpu-sim-ci:latest .

          # Log image size for documentation accuracy
          IMAGE_SIZE=$(docker images gpgpu-sim-ci:latest --format "{{.Size}}")
          echo "CI Docker image size: $IMAGE_SIZE"

      - name: Run simulation tests in container
        timeout-minutes: 50
        run: |
          docker run --rm \
            --memory=7g \
            --memory-swap=7g \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e CI_JOB=${{ matrix.job }} \
            -e CI_BUILD_JOBS=2 \
            -v ${{ github.workspace }}:/gpgpu-sim \
            -w /gpgpu-sim \
            gpgpu-sim-ci:latest \
            bash -c "./tests/ci/run_ci_tests.sh"

      - name: Upload simulation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-results-${{ matrix.job }}-attempt-${{ github.run_attempt }}
          path: tests/logs/ci
          if-no-files-found: warn

  verify-status:

    name: simulation-tests
    if: always()
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify status
        env:
          JOB_RESULT: ${{ needs.run-tests.result }}
        run: test "$JOB_RESULT" = success
