name: PR Tests

on:
  pull_request:
    branches: [flash]

jobs:
  simulation-tests:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI Docker image
        run: |
          docker build -f docker/Dockerfile.ci -t gpgpu-sim-ci:latest .

          # Log image size for documentation accuracy
          IMAGE_SIZE=$(docker images gpgpu-sim-ci:latest --format "{{.Size}}")
          echo "CI Docker image size: $IMAGE_SIZE"

      - name: Run simulation tests in container
        run: |
          docker run --rm \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -v ${{ github.workspace }}:/gpgpu-sim \
            -w /gpgpu-sim \
            gpgpu-sim-ci:latest \
            bash -c "./test/ci/run_ci_tests.sh"

      - name: Upload simulation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-results
          path: test/logs/ci
          if-no-files-found: warn
