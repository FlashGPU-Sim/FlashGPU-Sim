[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flashgpusim-tritontrace"
version = "0.1.0"
description = "Triton kernel capture and standalone launcher generation for FlashGPU-Sim"
requires-python = ">=3.10"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["TritonTrace*"]

[tool.setuptools.package-data]
TritonTrace = ["templates/*.tpl", "templates/*.inc"]
