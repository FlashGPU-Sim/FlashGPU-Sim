# PR CI jobs. Architecture manifests own source membership; this file owns
# which manifest selections CI builds and runs.

# Separate processes keep each medium kernel's cache/launch state cold.
# Both numerical correctness and frozen simulator cycles are blocking gates.
[jobs.sm90-sass-medium-d64f]
arch = "sm90"
config = "SM90_H100_SASS_FRONTEND"
frontend = "sass-timing"
cuda = "13.3"
tests = [
  { name = "forward", group = "fa3", profile = "medium-forward", gtest_filter = "Fa3PrefillFp16MediumTest.H32D64FullB16S512", post_check = "tests/ci/check_sass_medium.py" },
]

[jobs.sm90-sass-medium-d64c]
arch = "sm90"
config = "SM90_H100_SASS_FRONTEND"
frontend = "sass-timing"
cuda = "13.3"
tests = [
  { name = "forward", group = "fa3", profile = "medium-forward", gtest_filter = "Fa3PrefillFp16MediumTest.H32D64CausalB16S512", post_check = "tests/ci/check_sass_medium.py" },
]

[jobs.sm90-sass-medium-d128f]
arch = "sm90"
config = "SM90_H100_SASS_FRONTEND"
frontend = "sass-timing"
cuda = "13.3"
tests = [
  { name = "forward", group = "fa3", profile = "medium-forward", gtest_filter = "Fa3PrefillFp16MediumTest.H16D128FullB16S512", post_check = "tests/ci/check_sass_medium.py" },
]

[jobs.sm90-sass-medium-d128c]
arch = "sm90"
config = "SM90_H100_SASS_FRONTEND"
frontend = "sass-timing"
cuda = "13.3"
tests = [
  { name = "forward", group = "fa3", profile = "medium-forward", gtest_filter = "Fa3PrefillFp16MediumTest.H16D128CausalB16S512", post_check = "tests/ci/check_sass_medium.py" },
]

[jobs.sm120-core]
arch = "sm120"
tests = [
  { name = "unit", group = "unit" },
  { name = "integration", group = "integration" },
  { name = "barrier", group = "barrier", gtest_filter = "*-MBarrierSanityTest.*" },
  { name = "tma", group = "tma", gtest_filter = "*-*CPAsyncMethod*:*PerformanceComparison*" },
  { name = "mma", group = "mma" },
  { name = "trace", group = "trace", profile = "gpt2" },
]

[jobs.sm90-core]
arch = "sm90"
tests = [
  { name = "integration", group = "integration", post_check = "tests/scripts/check_cp_async_size.py" },
  { name = "barrier", group = "barrier" },
  { name = "wgmma", group = "wgmma" },
]

[jobs.sm90-fa2]
arch = "sm90"
tests = [
  { name = "smoke", group = "fa2", profile = "smoke", gtest_filter = "Fa2PrefillFp16SmokeTest.*" },
]

[jobs.sm90-fa3]
arch = "sm90"
tests = [
  { name = "forward-smoke", group = "fa3", profile = "smoke", gtest_filter = "Fa3PrefillFp16SmokeTest.*" },
  { name = "fixed-forward", group = "fa3", profile = "smoke", gtest_filter = "Fa3FwdHdim128Fp16IntegrationTest.FixedForwardCase" },
  { name = "backward-smoke", group = "fa3", profile = "smoke", gtest_filter = "Fa3PrefillFp16BackwardSmokeTest.*" },
  { name = "packgqa", group = "fa3", profile = "packgqa", gtest_filter = "Fa3FwdPackGqaFp16IntegrationTest.Smoke" },
]
