[arch]
nvcc_target = "sm_120a"
config = "SM120_RTX5090"

[workloads]
sources = [
  # Host-side simulator component tests.
  "unit/bulk_group_test.cc",
  "unit/local_interconnect_test.cc",
  "unit/memory_transport_test.cc",
  "unit/mshr_table_test.cc",

  # Portable integration tests.
  "integration/address_operand_test.cu",
  "integration/vector_operand_test.cu",
  "integration/vector_add_test.cu",
  "integration/shared_memory_optin_test.cu",
  "integration/ldst_matrix_test.cu",
  "integration/ordinary_ldst_request_width_test.cu",
  "integration/cp_async_src_size_test.cu",

  # SM120 correctness groups.
  "barrier/mbarrier_test.cu",
  "barrier/mbarrier_sanity_test.cu",
  "tma/host_tensormap_test.cu",
  "tma/tma_test.cu",
  "tma/tma_multidim_test.cu",
  "tma/tma_edge_cases_test.cu",
  "mma/mma_f16_test.cu",
  "mma/mma_bf16_test.cu",
  "mma/mma_tf32_test.cu",
  "mma/mma_s8_test.cu",

  # FlashAttention build variants.
  "fa2/fa2_fwd_fp16_test.cu",

  # Existing microbenchmark and trace layouts remain unchanged.
  "microbench/mbarrier/mbarrier_trywait_latency_bench.cc",
  "microbench/mma/inst_latency_bench.cc",
  "microbench/mma/mma_issue_bench.cc",
  "microbench/mma/mma_accept_queue_bench.cu",
  "microbench/mma/mma_saturation_bench.cu",
  "microbench/memory/global_load_bw_bench.cu",
  "microbench/memory/l2_hbm_interleave_bench.cu",
  "microbench/memory/l2_latency_bench.cu",
  "microbench/memory/l2_partition_latency_probe.cu",
  "trace/gpt2_data_driven_test.cu",
  "trace/gpt2_embedding_test.cu",
]
